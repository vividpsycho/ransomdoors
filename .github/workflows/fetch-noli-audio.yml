name: Fetch JX1DX1 audio assets

on:
  push:
    branches: [main]
    paths:
      - "tools/download_noli_audio.py"
      - ".github/workflows/fetch-noli-audio.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Download audio files from Fandom
        run: python tools/download_noli_audio.py
      - name: Commit downloaded audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/Sounds/Noli
          if git diff --cached --quiet; then
            echo "No new audio files to commit."
          else
            git commit -m "Add JX1DX1 Noli audio assets"
            git push
          fi
