name: Build and Release JX1DX1

on:
  push:
    branches: [main]
    paths:
      - "**.cs"
      - "**.xaml"
      - "**.csproj"
      - "Assets/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jx1dx1-release
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained Windows executable
        run: >-
          dotnet publish rans0m.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output publish

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: JX1DX1-win-x64
          path: publish/JX1DX1.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.5
          target_commitish: ${{ github.sha }}
          name: JX1DX1 v3.0.5
          body: |
            Windows x64 release of JX1DX1.

            - Self-contained single-file executable
            - Includes the project's embedded assets and voice-line audio
            - Requires Windows x64; .NET does not need to be installed separately
          files: publish/JX1DX1.exe
          fail_on_unmatched_files: true
          make_latest: true
